<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>Acervo</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mute:#6f6c66;--line:#e4e1da;--acc:#2f5d50;--acc2:#e8f0ed;--warn:#b4531f}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--mute:#9c9990;--line:#33322d;--acc:#7fc0ad;--acc2:#233530;--warn:#e0894f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:920px;margin:0 auto;padding:16px}
nav.tabs,nav.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.link{border:0;background:none;color:var(--mute);padding:2px 6px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}.bar button{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.cap{width:36px;height:52px;object-fit:cover;border-radius:4px;background:var(--acc2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
.row .n{width:34px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mute)}
.row.novo{border-left:4px solid #f90}
/* faixas da fila "para ler" (mesmas cores da planilha, blocos de posição) */
.row[data-b]{border-left:6px solid var(--bc)}
.row[data-b="1"],.sw[data-b="1"]{--bc:#8db4e2}.row[data-b="2"],.sw[data-b="2"]{--bc:#a6a6a6}.row[data-b="3"],.sw[data-b="3"]{--bc:#f79646}
.row[data-b="4"],.sw[data-b="4"]{--bc:#b1a0c7}.row[data-b="5"],.sw[data-b="5"]{--bc:#9bbb59}
.sw{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
.sw::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--bc,transparent);border:1px solid var(--line)}
.slot{display:flex;gap:8px;align-items:center;margin-bottom:6px}.slot span{width:70px;color:var(--mute);font-size:13px;flex:none}
.sub2{margin:-4px 0 12px 14px;padding-left:10px;border-left:2px solid var(--line)}.sub3{margin-left:30px}
.row.meta{flex-direction:column;align-items:stretch;gap:8px}
.dias{display:flex;gap:6px}.dia{flex:1;padding:6px 0;text-align:center;font-size:12px;line-height:1.25}
.dia.on{background:var(--acc);border-color:var(--acc);color:#fff}.dia.hoje{outline:2px solid var(--acc);outline-offset:1px}
label.pg{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin:0}label.pg input{width:76px;padding:5px 8px}
.rk-head{display:flex;align-items:center;gap:10px}.rk-head h3{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#f90;flex:none}
.pill.novo{background:#f90;color:#1c1b19;font-weight:600}
button.flag.on{background:#f90;border-color:#f90;color:#1c1b19}
.pill{font-size:12px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 8px;white-space:nowrap}
.panel{background:var(--acc2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel b{color:var(--acc)}
.muted{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:460px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:#0006}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.login input{margin-bottom:10px}
.err{color:var(--warn);min-height:1.4em;font-size:13px}
h3{margin:18px 0 8px;font-size:15px}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
@media(max-width:600px){
  body{font-size:16px}
  header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
  nav.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
  nav.sub{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-right:-12px;padding-right:12px}
  nav.sub::-webkit-scrollbar{display:none}
  nav.sub button{flex:none;white-space:nowrap}
  .sub2{margin-left:4px;padding-left:8px}.sub3{margin-left:10px}
  button{min-height:42px;padding:8px 14px}
  button.link{padding:6px 8px;font-size:13px}
  input,select,textarea{font-size:16px;padding:10px 12px}
  .bar{flex-wrap:wrap}
  .row{flex-wrap:wrap;padding:10px;gap:8px}
  .row .n{width:26px;font-size:13px}
  .row .t{flex:1 1 130px}
  .row>button:not(.link){flex:0 0 auto;padding:8px 10px;font-size:14px}
  .row>button:disabled{display:none}
  .row .t{flex:1 1 90px}
  .row{gap:6px}
  .cap{width:32px;height:46px}
  .row .n{width:22px}
  .row .actions{margin-left:auto}
  .row.meta>div:first-child{flex-wrap:wrap}
  .dia{min-height:50px}
  label.pg input{width:88px}
  .grid2{grid-template-columns:1fr}
  .panel[style]{flex-wrap:wrap}
  .slot span{width:46px}
  dialog{width:calc(100% - 20px);max-height:92vh;overflow:auto;padding:16px}
  dialog form div[style*="display:flex"]{flex-wrap:wrap}
  dialog form div[style*="display:flex"] button{flex:1 1 auto}
  .login{margin:8vh auto}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
// ---- Acesso: mesmo modelo das finanças (senha única + token de sessão) ----
const FN = 'https://gdywqnmuyxmsbpwrhfub.supabase.co/functions/v1/';
const TOKEN_KEY = 'fc_token'; // mesma sessão do app de finanças
const token = () => localStorage.getItem(TOKEN_KEY) || '';
async function api(action, payload = {}) {
  const r = await fetch(FN + 'acervo-api', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-app-token': token() }, body: JSON.stringify({ action, ...payload }) });
  const d = await r.json().catch(() => ({ ok: false, error: 'resposta inválida' }));
  if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); loginView('Sessão expirada.'); throw new Error('Sessão expirada'); }
  if (!d.ok) throw new Error(d.error || 'erro');
  return d;
}

const $ = (s, r = document) => r.querySelector(s);
const cap = x => x.imagem_url ? `<img class="cap" loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(x.imagem_url)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'cap',textContent:this.dataset.l}))" data-l="${esc((x.titulo || '?')[0].toUpperCase())}">` : `<span class="cap">${esc((x.titulo || '?')[0].toUpperCase())}</span>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app'), dlg = $('#dlg');
const st = { tab: 'series', sub: 'assistindo', q: '', titulos: [], livros: [], rank: [], estado: null, lano: 'todos', soNovas: false, rk: 'vida', rkAno: null, anosExtra: [], semana: null, metas: [], dias: [] };

const SUBS = {
  series: [['assistindo','Assistindo'],['para_assistir','Para assistir'],['encerrada','Encerradas'],['miniserie','Minisséries']],
  filmes: [['assistido','Assistidos'],['para_assistir','Para assistir']],
  livros: [['fila','Fila'],['lendo','Lendo'],['lido','Lidos'],['meta','Meta da semana'],['ranking','Rankings']]
};
const STATUS_LABEL = { assistindo:'Assistindo', para_assistir:'Para assistir', encerrada:'Encerrada', assistido:'Assistido', para_ler:'Para ler', lendo:'Lendo', lido:'Lido' };

// ---------- Auth ----------
async function boot() {
  if (!token()) return loginView();
  try {
    const r = await fetch(FN + 'app-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token() }) });
    (await r.json()).ok ? await load() : loginView();
  } catch { loginView('Sem conexão.'); }
}
function loginView(msg = '') {
  app.innerHTML = `<div class="login"><h1>Acervo</h1><p class="muted">Séries, filmes e livros.</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <div class="err" id="err">${esc(msg)}</div>
    <button class="primary" id="in" style="width:100%">Entrar</button></div>`;
  const go = async () => {
    try {
      const r = await fetch(FN + 'app-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
      const d = await r.json();
      if (!d.ok) return ($('#err').textContent = 'Senha incorreta.');
      localStorage.setItem(TOKEN_KEY, d.token);
      await load();
    } catch { $('#err').textContent = 'Sem conexão.'; }
  };
  $('#in').onclick = go;
  $('#pw').onkeydown = e => e.key === 'Enter' && go();
  $('#pw').focus();
}

// ---------- Dados ----------
async function load() {
  try {
    const d = await api('load');
    Object.assign(st, { titulos: d.titulos, livros: d.livros, rank: d.ranking, estado: d.estado, metas: d.metas, dias: d.dias });
    render();
  } catch (err) {
    if (err.message === 'Sessão expirada') return;
    app.innerHTML = `<div class="login"><h3>Erro ao carregar</h3><p class="err">${esc(err.message)}</p><button id="out">Sair</button></div>`;
    $('#out').onclick = logout;
  }
}
function logout() { localStorage.removeItem(TOKEN_KEY); loginView(); }
const run = async (action, payload) => { try { await api(action, payload); } catch (e) { if (e.message !== 'Sessão expirada') alert(e.message); } load(); };

// ---------- Views ----------
function render() {
  const subs = SUBS[st.tab];
  if (!subs.some(s => s[0] === st.sub)) st.sub = subs[0][0];
  app.innerHTML = `<header><h1>Acervo</h1><button class="link" id="out">Sair</button></header><main>
    <nav class="tabs">${[['series','Séries'],['filmes','Filmes'],['livros','Livros']].map(([k, n]) => `<button data-tab="${k}" class="${st.tab === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <nav class="sub">${subs.map(([k, n]) => `<button data-sub="${k}" class="${st.sub === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <div id="body"></div></main>`;
  $('#out').onclick = logout;
  app.querySelectorAll('[data-tab]').forEach(b => (b.onclick = () => { st.tab = b.dataset.tab; st.q = ''; render(); }));
  app.querySelectorAll('[data-sub]').forEach(b => (b.onclick = () => { st.sub = b.dataset.sub; st.q = ''; render(); }));
  (st.tab === 'livros' ? viewLivros : viewTitulos)($('#body'));
}
function searchBar(host, label, onAdd) {
  host.insertAdjacentHTML('beforeend', `<div class="bar"><input id="q" placeholder="Buscar…" value="${esc(st.q)}"><button class="primary" id="add">+ ${label}</button></div><div id="list"></div>`);
  $('#q').oninput = e => { st.q = e.target.value; drawList(); };
  $('#add').onclick = onAdd;
}
let drawList = () => {};

// Séries e filmes
function titulosAtuais() {
  const tipo = st.tab === 'filmes' ? 'filme' : null, sub = st.sub;
  return st.titulos.filter(t => tipo
    ? t.tipo === 'filme' && t.status === sub
    : sub === 'miniserie' ? t.tipo === 'miniserie' : t.tipo === 'serie' && t.status === sub);
}
function viewTitulos(host) {
  const emAndamento = st.tab === 'series' && st.sub === 'assistindo';
  if (emAndamento) {
    const n = titulosAtuais().filter(t => t.tem_nova_temporada).length;
    host.insertAdjacentHTML('beforeend', `<div class="panel" style="display:flex;align-items:center;gap:10px"><span class="dot"></span>
      <span style="flex:1"><b>${n}</b> ${n === 1 ? 'série com temporada nova' : 'séries com temporada nova'} para assistir</span>
      <button class="flag ${st.soNovas ? 'on' : ''}" id="so-novas">${st.soNovas ? 'Mostrar todas' : 'Só as novas'}</button></div>`);
    $('#so-novas').onclick = () => { st.soNovas = !st.soNovas; render(); };
  }
  searchBar(host, 'Adicionar', () => editTitulo());
  drawList = () => {
    const q = st.q.toLowerCase();
    let items = titulosAtuais().filter(t => t.titulo.toLowerCase().includes(q));
    if (emAndamento) {
      if (st.soNovas) items = items.filter(t => t.tem_nova_temporada);
      items = [...items].sort((a, b) => Number(b.tem_nova_temporada) - Number(a.tem_nova_temporada)); // novas primeiro
    }
    $('#list').innerHTML = items.length ? items.map(t => {
      const sub = [t.temporadas_assistidas != null && `${t.temporadas_assistidas} temp.`, t.proxima_temporada && `próx.: ${t.proxima_temporada}`, t.streaming, t.ano].filter(Boolean).join(' · ');
      const nova = emAndamento && t.tem_nova_temporada;
      const acoes = emAndamento ? `<button class="flag ${nova ? 'on' : ''}" data-flag="${t.id}" title="Marcar/desmarcar temporada nova disponível">${nova ? 'Nova temp.' : 'Marcar nova'}</button>${nova ? `<button class="primary" data-vi="${t.id}" title="Soma 1 às temporadas assistidas e remove a marca">Assisti</button>` : ''}` : '';
      return `<div class="row ${nova ? 'novo' : ''}"><span class="n">${t.ranking ?? ''}</span>${cap(t)}<div class="t">${esc(t.titulo)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
        ${t.nota != null ? `<span class="pill">★ ${t.nota}</span>` : ''}${acoes}
        <span class="actions"><button class="link" data-e="${t.id}">editar</button></span></div>`;
    }).join('') : '<p class="muted">Nada por aqui.</p>';
    const T = id => st.titulos.find(t => t.id === id);
    $('#list').querySelectorAll('[data-e]').forEach(b => (b.onclick = () => editTitulo(T(b.dataset.e))));
    $('#list').querySelectorAll('[data-flag]').forEach(b => (b.onclick = () => run('save_titulo', { id: b.dataset.flag, row: { tem_nova_temporada: !T(b.dataset.flag).tem_nova_temporada } })));
    $('#list').querySelectorAll('[data-vi]').forEach(b => (b.onclick = () => run('save_titulo', { id: b.dataset.vi, row: { temporadas_assistidas: (T(b.dataset.vi).temporadas_assistidas ?? 0) + 1, tem_nova_temporada: false } })));
  };
  drawList();
}
function editTitulo(t) {
  const isNew = !t;
  const base = t || (st.tab === 'filmes'
    ? { tipo: 'filme', status: st.sub }
    : st.sub === 'miniserie' ? { tipo: 'miniserie', status: 'encerrada' } : { tipo: 'serie', status: st.sub });
  const statuses = base.tipo === 'filme' ? ['assistido', 'para_assistir'] : base.tipo === 'miniserie' ? ['encerrada', 'assistindo', 'para_assistir'] : ['assistindo', 'para_assistir', 'encerrada'];
  const serie = base.tipo !== 'filme';
  dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${isNew ? 'Novo' : 'Editar'} ${base.tipo === 'filme' ? 'filme' : base.tipo === 'miniserie' ? 'minissérie' : 'série'}</h3>
    <label>Título</label><input id="f-titulo" value="${esc(base.titulo)}" required>
    <div class="grid2"><div><label>Situação</label><select id="f-status">${statuses.map(s => `<option value="${s}" ${s === base.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <div><label>Ranking (posição)</label><input id="f-ranking" type="number" value="${base.ranking ?? ''}"></div></div>
    <div class="grid2"><div><label>Streaming</label><input id="f-streaming" value="${esc(base.streaming)}"></div>
    <div><label>Nota (0–10)</label><input id="f-nota" type="number" step="0.1" min="0" max="10" value="${base.nota ?? ''}"></div></div>
    ${serie ? `<div class="grid2"><div><label>Temporadas assistidas</label><input id="f-temps" type="number" value="${base.temporadas_assistidas ?? ''}"></div>
    <div><label>Próxima temporada</label><input id="f-prox" placeholder="2027, 2026-09 ou 2026-11-11" value="${esc(base.proxima_temporada)}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="f-nova" type="checkbox" style="width:auto" ${base.tem_nova_temporada ? 'checked' : ''}> <span class="dot"></span> Temporada nova disponível para assistir</label>` :`<label>Ano</label><input id="f-ano" type="number" value="${base.ano ?? ''}">`}
    <label>Imagem (endereço da capa/pôster)</label><input id="f-img" placeholder="https://…" value="${esc(base.imagem_url)}">
    <label>Observação</label><textarea id="f-obs" rows="2">${esc(base.observacao)}</textarea>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button>
    <span style="flex:1"></span>${isNew ? '' : '<button value="del" formnovalidate style="color:var(--warn)">Excluir</button>'}</div></form>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v === 'del' && confirm('Excluir?')) return run('delete_titulo', { id: t.id });
    if (v !== 'ok') return;
    const num = id => { const x = $(id); return x && x.value !== '' ? Number(x.value) : null; };
    const row = { tipo: base.tipo, titulo: $('#f-titulo').value.trim(), status: $('#f-status').value, ranking: num('#f-ranking'),
      streaming: $('#f-streaming').value.trim() || null, nota: num('#f-nota'), observacao: $('#f-obs').value.trim() || null,
      temporadas_assistidas: serie ? num('#f-temps') : null, proxima_temporada: serie ? ($('#f-prox').value.trim() || null) : null, ano: serie ? null : num('#f-ano'),
      tem_nova_temporada: serie ? $('#f-nova').checked : false, imagem_url: $('#f-img').value.trim() || null };
    run('save_titulo', { id: t?.id, row });
  };
  dlg.showModal();
}

// Livros
const faixa = i => (i === 0 ? [2, 100] : [i * 100 + 1, (i + 1) * 100]);
// Cor da posição na fila (como na planilha): 1–20 sem cor; 21–100 azul; 101–200 cinza; 201–300 laranja; 301–400 roxo; 401+ verde.
const banda = p => (!p || p <= 20 ? 0 : p <= 100 ? 1 : p <= 200 ? 2 : p <= 300 ? 3 : p <= 400 ? 4 : 5);
const LEGENDA = [['','1–20'],['1','21–100'],['2','101–200'],['3','201–300'],['4','301–400'],['5','401+']];
function viewLivros(host) {
  const fila = st.livros.filter(l => l.status === 'para_ler').sort((a, b) => a.posicao_fila - b.posicao_fila);
  if (st.sub === 'ranking') return viewRanking(host);
  if (st.sub === 'meta') return viewMeta(host);
  const est = st.estado || { proximo_tipo: 'fora', faixa_idx: 0 };
  const [lo, hi] = faixa(est.faixa_idx), max = fila.length;
  const elegivel = l => est.proximo_tipo === 'ordem' ? l.posicao_fila === 1 : l.posicao_fila >= lo && (l.posicao_fila <= hi || max < lo);
  if (st.sub === 'fila') host.insertAdjacentHTML('beforeend', `<div class="panel">${est.proximo_tipo === 'ordem'
    ? `Vez do <b>primeiro da fila</b>: ${esc(fila[0]?.titulo ?? '—')}`
    : `Vez de um livro <b>fora de ordem</b>, entre as posições <b>${lo}</b> e <b>${Math.min(hi, max)}</b>. Os demais sobem de número ao escolher.`}</div>`);
  if (st.sub === 'fila') host.insertAdjacentHTML('beforeend', `<p class="muted" style="font-size:13px;margin:-4px 0 12px">Faixas da fila: ${LEGENDA.map(([b, t]) => `<span class="sw" ${b ? `data-b="${b}"` : ''}>${t}</span>`).join('')}</p>`);
  if (st.sub === 'lido') {
    const anos = [...new Set(st.livros.filter(l => l.status === 'lido').map(l => l.ano_leitura ?? 'antigos'))].sort().reverse();
    host.insertAdjacentHTML('beforeend', `<div class="bar"><select id="ano"><option value="todos">Todos os anos</option>${anos.map(a => `<option ${String(a) === st.lano ? 'selected' : ''}>${a}</option>`).join('')}</select></div>`);
    $('#ano').onchange = e => { st.lano = e.target.value; drawList(); };
  }
  searchBar(host, 'Adicionar', () => editLivro());
  drawList = () => {
    const q = st.q.toLowerCase();
    let items = st.sub === 'fila' ? fila : st.livros.filter(l => l.status === st.sub);
    if (st.sub === 'lido') items = items.filter(l => st.lano === 'todos' || String(l.ano_leitura ?? 'antigos') === st.lano).sort((a, b) => (b.ano_leitura ?? 0) - (a.ano_leitura ?? 0));
    items = items.filter(l => (l.titulo + ' ' + (l.autor ?? '')).toLowerCase().includes(q));
    const shown = items; // lista completa (fila até o último livro)
    $('#list').innerHTML = (shown.length ? shown.map(l => {
      const sub = [l.autor, l.categoria, l.comprado && 'comprado'].filter(Boolean).join(' · ');
      const act = l.status === 'para_ler' ? `<button data-go="${l.id}" ${elegivel(l) ? '' : 'disabled'} class="${elegivel(l) ? 'primary' : ''}">Começar</button>`
        : l.status === 'lendo' ? `<button data-fin="${l.id}" class="primary">Concluir</button>` : '';
      const b = l.status === 'para_ler' ? banda(l.posicao_fila) : 0;
      return `<div class="row" ${b ? `data-b="${b}"` : ''}><span class="n">${l.posicao_fila ?? ''}</span>${cap(l)}<div class="t">${esc(l.titulo)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
        ${l.ano_leitura ? `<span class="pill">${l.ano_leitura}</span>` : ''}${act}<span class="actions"><button class="link" data-e="${l.id}">editar</button></span></div>`;
    }).join('') : '<p class="muted">Nada por aqui.</p>') + (items.length ? `<p class="muted" style="text-align:center">${items.length} ${items.length === 1 ? 'livro' : 'livros'}${st.sub === 'fila' ? ' na fila' : ''}</p>` : '');
    const L = id => st.livros.find(l => l.id === id);
    $('#list').querySelectorAll('[data-e]').forEach(b => (b.onclick = () => editLivro(L(b.dataset.e))));
    $('#list').querySelectorAll('[data-go]').forEach(b => (b.onclick = () => run('iniciar_leitura', { id: b.dataset.go })));
    $('#list').querySelectorAll('[data-fin]').forEach(b => (b.onclick = () => {
      const ano = prompt('Ano de leitura:', new Date().getFullYear()); if (!ano) return;
      run('concluir_leitura', { id: b.dataset.fin, ano });
    }));
  };
  drawList();
}
function editLivro(l) {
  const isNew = !l, base = l || { status: st.sub === 'fila' ? 'para_ler' : st.sub };
  dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${isNew ? 'Novo' : 'Editar'} livro</h3>
    <label>Título</label><input id="f-titulo" value="${esc(base.titulo)}" required>
    <div class="grid2"><div><label>Autor</label><input id="f-autor" value="${esc(base.autor)}"></div><div><label>Categoria</label><input id="f-cat" value="${esc(base.categoria)}"></div></div>
    <div class="grid2"><div><label>Situação</label><select id="f-status">${['para_ler', 'lendo', 'lido'].map(s => `<option value="${s}" ${s === base.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <div><label>Ano de leitura</label><input id="f-ano" type="number" value="${base.ano_leitura ?? ''}"></div></div>
    <div class="grid2"><div><label>Nota (0–10)</label><input id="f-nota" type="number" step="0.1" min="0" max="10" value="${base.nota ?? ''}"></div>
    <div><label>Comprado</label><select id="f-comp"><option value="0">Não</option><option value="1" ${base.comprado ? 'selected' : ''}>Sim</option></select></div></div>
    <label>Imagem (endereço da capa)</label><input id="f-img" placeholder="https://…" value="${esc(base.imagem_url)}">
    <label>Observação</label><textarea id="f-obs" rows="2">${esc(base.observacao)}</textarea>
    <p class="muted" style="font-size:12px">Novos livros entram no fim da fila. Para mudar a posição use o SQL ou a regra de escolha.</p>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button>
    <span style="flex:1"></span>${isNew ? '' : '<button value="del" formnovalidate style="color:var(--warn)">Excluir</button>'}</div></form>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v === 'del' && confirm('Excluir?')) return run('delete_livro', { id: l.id });
    if (v !== 'ok') return;
    const num = id => ($(id).value !== '' ? Number($(id).value) : null);
    const status = $('#f-status').value;
    const row = { titulo: $('#f-titulo').value.trim(), autor: $('#f-autor').value.trim() || null, categoria: $('#f-cat').value.trim() || null,
      status, ano_leitura: num('#f-ano'), nota: num('#f-nota'), comprado: $('#f-comp').value === '1', imagem_url: $('#f-img').value.trim() || null, observacao: $('#f-obs').value.trim() || null };
    run('save_livro', { id: l?.id, row });
  };
  dlg.showModal();
}
// ---------- Meta de leitura da semana ----------
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const segundaDe = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymd(x); };
const somaDias = (s, n) => { const x = new Date(s + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const DIAS_SEM = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const ddmm = s => `${s.slice(8)}/${s.slice(5, 7)}`;

function viewMeta(host) {
  const atual = segundaDe(new Date()), hoje = ymd(new Date());
  if (!st.semana) st.semana = atual;
  const metas = st.metas.filter(m => m.semana === st.semana);
  host.insertAdjacentHTML('beforeend', `<div class="bar" style="align-items:center"><button id="sm-prev" aria-label="Semana anterior">‹</button>
    <div style="flex:1;text-align:center"><b>${ddmm(st.semana)} – ${ddmm(somaDias(st.semana, 6))}</b>${st.semana === atual ? ' <span class="pill">esta semana</span>' : ''}</div>
    <button id="sm-next" aria-label="Próxima semana">›</button><button class="primary" id="sm-new">+ Nova meta</button></div><div id="list"></div>`);
  $('#sm-prev').onclick = () => { st.semana = somaDias(st.semana, -7); render(); };
  $('#sm-next').onclick = () => { st.semana = somaDias(st.semana, 7); render(); };
  $('#sm-new').onclick = () => editMeta();
  $('#list').innerHTML = metas.length ? metas.map(m => {
    const l = st.livros.find(x => x.id === m.livro_id) || { titulo: '?' };
    const feitos = new Set(st.dias.filter(d => d.meta_id === m.id).map(d => d.dia));
    const pct = l.total_paginas ? Math.min(100, Math.round(m.pagina_atual / l.total_paginas * 100)) : null;
    return `<div class="row meta"><div style="display:flex;gap:10px;align-items:center;width:100%">${cap(l)}<div class="t">${esc(l.titulo)}
        <small>${m.paginas_por_dia} pág./dia · ${feitos.size}/7 dias · ${m.pagina_atual - m.pagina_inicial} pág. na semana${pct != null ? ` · ${pct}% do livro` : ''}</small></div>
        <label class="pg">pág. <input type="number" min="0" value="${m.pagina_atual}" data-pg="${m.id}"></label>
        <button class="link" data-em="${m.id}">editar</button></div>
      <div class="dias">${DIAS_SEM.map((n, i) => { const d = somaDias(st.semana, i); return `<button class="dia ${feitos.has(d) ? 'on' : ''} ${d === hoje ? 'hoje' : ''}" data-m="${m.id}" data-d="${d}" aria-pressed="${feitos.has(d)}">${n}<br>${d.slice(8)}</button>`; }).join('')}</div>
      <div style="display:flex;gap:8px"><button class="link" data-prox="${m.id}">Repetir na próxima semana</button></div></div>`;
  }).join('') : '<p class="muted">Nenhuma meta nesta semana. Use <b>+ Nova meta</b> para cadastrar a página em que você está e quantas páginas quer ler por dia.</p>';
  const M = id => st.metas.find(m => m.id === id);
  $('#list').querySelectorAll('[data-d]').forEach(b => (b.onclick = () => run('toggle_dia', { meta_id: b.dataset.m, dia: b.dataset.d, feito: !b.classList.contains('on') })));
  $('#list').querySelectorAll('[data-pg]').forEach(i => (i.onchange = () => run('set_pagina', { id: i.dataset.pg, pagina: i.value })));
  $('#list').querySelectorAll('[data-em]').forEach(b => (b.onclick = () => editMeta(M(b.dataset.em))));
  $('#list').querySelectorAll('[data-prox]').forEach(b => (b.onclick = () => {
    const m = M(b.dataset.prox);
    run('save_meta', { livro_id: m.livro_id, semana: somaDias(m.semana, 7), pagina_inicial: m.pagina_atual, paginas_por_dia: m.paginas_por_dia });
    st.semana = somaDias(m.semana, 7);
  }));
}
function editMeta(m) {
  const isNew = !m, l = m && st.livros.find(x => x.id === m.livro_id);
  const lendo = st.livros.filter(x => x.status === 'lendo');
  dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${isNew ? 'Nova meta da semana' : 'Editar meta'}</h3>
    ${isNew ? `<label>Livro</label><input id="m-livro" list="dl-lendo" placeholder="título do livro" value="${esc(lendo.length === 1 ? lendo[0].titulo : '')}" required><datalist id="dl-lendo">${lendo.map(x => `<option value="${esc(x.titulo)}">`).join('')}</datalist>` : `<p><b>${esc(l?.titulo)}</b></p>`}
    <div class="grid2"><div><label>Página em que estou</label><input id="m-ini" type="number" min="0" required value="${m ? m.pagina_inicial : ''}"></div>
    <div><label>Meta de páginas por dia</label><input id="m-ppd" type="number" min="1" required value="${m ? m.paginas_por_dia : ''}"></div></div>
    <label>Total de páginas do livro (opcional)</label><input id="m-tot" type="number" min="1" value="${l?.total_paginas ?? ''}">
    <p class="muted" style="font-size:12px">Semana de ${ddmm(m ? m.semana : st.semana)} a ${ddmm(somaDias(m ? m.semana : st.semana, 6))}. Ao marcar um dia, as páginas da meta são somadas à página atual.</p>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button><span style="flex:1"></span>${isNew ? '' : '<button value="del" formnovalidate style="color:var(--warn)">Excluir</button>'}</div></form>`;
  dlg.onclose = () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v === 'del' && confirm('Excluir esta meta?')) return run('delete_meta', { id: m.id });
    if (v !== 'ok') return;
    let livro_id = m?.livro_id;
    if (isNew) {
      const t = $('#m-livro').value.trim().toLowerCase();
      const achados = st.livros.filter(x => x.titulo.toLowerCase() === t).sort((a, b) => (b.status === 'lendo') - (a.status === 'lendo'));
      if (!achados.length) return alert('Livro não encontrado. Digite exatamente o título de um livro do acervo.');
      livro_id = achados[0].id;
    }
    const tot = $('#m-tot').value;
    run('save_meta', { id: m?.id, livro_id, semana: m ? m.semana : st.semana, pagina_inicial: $('#m-ini').value, paginas_por_dia: $('#m-ppd').value, total_paginas: tot || null });
  };
  dlg.showModal();
}

function viewRanking(host) {
  const nome = id => st.livros.find(l => l.id === id)?.titulo ?? '?';
  const rk = (tipo, ano) => st.rank.filter(r => r.tipo === tipo && (ano == null || r.ano === ano)).sort((a, b) => a.posicao - b.posicao);
  const lidos = ano => st.livros.filter(l => l.status === 'lido' && (ano == null || l.ano_leitura === ano)).map(l => l.titulo);
  const bloco = (titulo, itens, edit, rotulo = r => r.posicao) => `<div class="rk-head"><h3>${titulo}</h3><button class="primary" data-rk="${edit}">Editar</button></div>` +
    (itens.length ? itens.map(r => `<div class="row"><span class="n">${rotulo(r)}</span><div class="t">${esc(nome(r.livro_id))}</div></div>`).join('') : '<p class="muted">Ainda não preenchido.</p>');
  const atual = new Date().getFullYear();
  const anos = [...new Set([atual, ...st.anosExtra, ...st.rank.filter(r => r.tipo === 'top10_ano').map(r => r.ano)])].sort().reverse();
  if (!anos.includes(st.rkAno)) st.rkAno = anos.find(a => rk('top10_ano', a).length) ?? anos[0];
  const nav2 = [['vida', 'Top 10 da vida'], ['ano', 'Top 10 por ano'], ['melhor', 'Melhor leitura do ano']];
  let html = `<nav class="sub sub2">${nav2.map(([k, n]) => `<button data-rk2="${k}" class="${st.rk === k ? 'on' : ''}">${n}</button>`).join('')}</nav>`;
  if (st.rk === 'ano') html += `<nav class="sub sub2 sub3">${anos.map(a => `<button data-rkano="${a}" class="${st.rkAno === a ? 'on' : ''}">${a}</button>`).join('')}<button data-rk="novo-ano">+ outro ano</button></nav>`;
  html += st.rk === 'vida' ? bloco('Top 10 livros da vida', rk('top10_vida'), 'vida')
    : st.rk === 'ano' ? bloco(`Top 10 de ${st.rkAno}`, rk('top10_ano', st.rkAno), 'ano:' + st.rkAno)
    : bloco('Melhor leitura de cada ano', rk('melhor_ano').sort((a, b) => a.ano - b.ano), 'melhor', r => r.ano);
  host.insertAdjacentHTML('beforeend', html);
  host.querySelectorAll('[data-rk2]').forEach(b => (b.onclick = () => { st.rk = b.dataset.rk2; render(); }));
  host.querySelectorAll('[data-rkano]').forEach(b => (b.onclick = () => { st.rkAno = Number(b.dataset.rkano); render(); }));

  const editor = (titulo, slots, onSave) => {
    dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${esc(titulo)}</h3>
      ${slots.map((s, i) => `<div class="slot"><span>${esc(s.label)}</span><input data-i="${i}" list="dl-${i}" value="${esc(s.value)}" placeholder="título do livro"><datalist id="dl-${i}">${s.books.map(b => `<option value="${esc(b)}">`).join('')}</datalist></div>`).join('')}
      <p class="muted" style="font-size:12px">Digite ou escolha um livro já lido. Se o título não existir, ele é cadastrado como lido. Deixe em branco para limpar a posição.</p>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button></div></form>`;
    dlg.onclose = () => { dlg.onclose = null; if (dlg.returnValue === 'ok') onSave([...dlg.querySelectorAll('input[data-i]')].map(i => i.value.trim())); };
    dlg.showModal();
  };
  const salvar = (tipo, ano, titulos) => api('save_ranking', { tipo, ano, titulos });
  const pos10 = (tipo, ano) => Array.from({ length: 10 }, (_, i) => ({ label: `${i + 1}º`, value: rk(tipo, ano).find(r => r.posicao === i + 1) ? nome(rk(tipo, ano).find(r => r.posicao === i + 1).livro_id) : '', books: lidos(ano) }));
  const guard = p => p.catch(e => e.message !== 'Sessão expirada' && alert(e.message)).then(load);

  host.querySelectorAll('[data-rk]').forEach(b => (b.onclick = () => {
    const k = b.dataset.rk;
    if (k === 'vida') editor('Top 10 livros da vida', pos10('top10_vida', null), t => guard(salvar('top10_vida', null, t)));
    else if (k === 'novo-ano' || k.startsWith('ano:')) {
      const ano = k === 'novo-ano' ? Number(prompt('Ano do Top 10:', atual - 1)) : Number(k.slice(4));
      if (!ano) return;
      if (!anos.includes(ano)) st.anosExtra.push(ano);
      st.rk = 'ano'; st.rkAno = ano;
      editor(`Top 10 de ${ano}`, pos10('top10_ano', ano), t => guard(salvar('top10_ano', ano, t)));
    } else {
      const primeiro = Math.min(2021, ...rk('melhor_ano').map(r => r.ano));
      const anosM = Array.from({ length: atual - primeiro + 1 }, (_, i) => atual - i);
      const slots = anosM.map(a => { const r = rk('melhor_ano', a)[0]; return { label: String(a), value: r ? nome(r.livro_id) : '', books: lidos(a) }; });
      editor('Melhor leitura de cada ano', slots, async t => {
        try { for (let i = 0; i < anosM.length; i++) if (t[i] !== slots[i].value) await salvar('melhor_ano', anosM[i], t[i] ? [t[i]] : []); }
        catch (e) { if (e.message !== 'Sessão expirada') alert(e.message); }
        load();
      });
    }
  }));
}

boot();
</script>
</body>
