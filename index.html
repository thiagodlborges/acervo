<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mute:#6f6c66;--line:#e4e1da;--acc:#2f5d50;--acc2:#e8f0ed;--warn:#b4531f}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--mute:#9c9990;--line:#33322d;--acc:#7fc0ad;--acc2:#233530;--warn:#e0894f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:920px;margin:0 auto;padding:16px}
nav.tabs,nav.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.link{border:0;background:none;color:var(--mute);padding:2px 6px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}.bar button{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row .n{width:34px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mute)}
.row.novo{border-left:4px solid #f90}
.dot{width:10px;height:10px;border-radius:50%;background:#f90;flex:none}
.pill.novo{background:#f90;color:#1c1b19;font-weight:600}
button.flag.on{background:#f90;border-color:#f90;color:#1c1b19}
.pill{font-size:12px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 8px;white-space:nowrap}
.panel{background:var(--acc2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel b{color:var(--acc)}
.muted{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:460px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:#0006}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.login input{margin-bottom:10px}
.err{color:var(--warn);min-height:1.4em;font-size:13px}
h3{margin:18px 0 8px;font-size:15px}
@media(max-width:520px){.row .actions{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
// ---- Acesso: mesmo modelo das finanças (senha única + token de sessão) ----
const FN = 'https://gdywqnmuyxmsbpwrhfub.supabase.co/functions/v1/';
const TOKEN_KEY = 'fc_token'; // mesma sessão do app de finanças
const token = () => localStorage.getItem(TOKEN_KEY) || '';
async function api(action, payload = {}) {
  const r = await fetch(FN + 'acervo-api', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-app-token': token() }, body: JSON.stringify({ action, ...payload }) });
  const d = await r.json().catch(() => ({ ok: false, error: 'resposta inválida' }));
  if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); loginView('Sessão expirada.'); throw new Error('Sessão expirada'); }
  if (!d.ok) throw new Error(d.error || 'erro');
  return d;
}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app'), dlg = $('#dlg');
const st = { tab: 'series', sub: 'assistindo', q: '', titulos: [], livros: [], rank: [], estado: null, lano: 'todos', soNovas: false };

const SUBS = {
  series: [['assistindo','Assistindo'],['para_assistir','Para assistir'],['encerrada','Encerradas'],['miniserie','Minisséries']],
  filmes: [['assistido','Assistidos'],['para_assistir','Para assistir']],
  livros: [['fila','Fila'],['lendo','Lendo'],['lido','Lidos'],['ranking','Rankings']]
};
const STATUS_LABEL = { assistindo:'Assistindo', para_assistir:'Para assistir', encerrada:'Encerrada', assistido:'Assistido', para_ler:'Para ler', lendo:'Lendo', lido:'Lido' };

// ---------- Auth ----------
async function boot() {
  if (!token()) return loginView();
  try {
    const r = await fetch(FN + 'app-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token() }) });
    (await r.json()).ok ? await load() : loginView();
  } catch { loginView('Sem conexão.'); }
}
function loginView(msg = '') {
  app.innerHTML = `<div class="login"><h1>Acervo</h1><p class="muted">Séries, filmes e livros.</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <div class="err" id="err">${esc(msg)}</div>
    <button class="primary" id="in" style="width:100%">Entrar</button></div>`;
  const go = async () => {
    try {
      const r = await fetch(FN + 'app-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
      const d = await r.json();
      if (!d.ok) return ($('#err').textContent = 'Senha incorreta.');
      localStorage.setItem(TOKEN_KEY, d.token);
      await load();
    } catch { $('#err').textContent = 'Sem conexão.'; }
  };
  $('#in').onclick = go;
  $('#pw').onkeydown = e => e.key === 'Enter' && go();
  $('#pw').focus();
}

// ---------- Dados ----------
async function load() {
  try {
    const d = await api('load');
    Object.assign(st, { titulos: d.titulos, livros: d.livros, rank: d.ranking, estado: d.estado });
    render();
  } catch (err) {
    if (err.message === 'Sessão expirada') return;
    app.innerHTML = `<div class="login"><h3>Erro ao carregar</h3><p class="err">${esc(err.message)}</p><button id="out">Sair</button></div>`;
    $('#out').onclick = logout;
  }
}
function logout() { localStorage.removeItem(TOKEN_KEY); loginView(); }
const run = async (action, payload) => { try { await api(action, payload); } catch (e) { if (e.message !== 'Sessão expirada') alert(e.message); } load(); };

// ---------- Views ----------
function render() {
  const subs = SUBS[st.tab];
  if (!subs.some(s => s[0] === st.sub)) st.sub = subs[0][0];
  app.innerHTML = `<header><h1>Acervo</h1><button class="link" id="out">Sair</button></header><main>
    <nav class="tabs">${[['series','Séries'],['filmes','Filmes'],['livros','Livros']].map(([k, n]) => `<button data-tab="${k}" class="${st.tab === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <nav class="sub">${subs.map(([k, n]) => `<button data-sub="${k}" class="${st.sub === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <div id="body"></div></main>`;
  $('#out').onclick = logout;
  app.querySelectorAll('[data-tab]').forEach(b => (b.onclick = () => { st.tab = b.dataset.tab; st.q = ''; render(); }));
  app.querySelectorAll('[data-sub]').forEach(b => (b.onclick = () => { st.sub = b.dataset.sub; st.q = ''; render(); }));
  (st.tab === 'livros' ? viewLivros : viewTitulos)($('#body'));
}
function searchBar(host, label, onAdd) {
  host.insertAdjacentHTML('beforeend', `<div class="bar"><input id="q" placeholder="Buscar…" value="${esc(st.q)}"><button class="primary" id="add">+ ${label}</button></div><div id="list"></div>`);
  $('#q').oninput = e => { st.q = e.target.value; drawList(); };
  $('#add').onclick = onAdd;
}
let drawList = () => {};

// Séries e filmes
function titulosAtuais() {
  const tipo = st.tab === 'filmes' ? 'filme' : null, sub = st.sub;
  return st.titulos.filter(t => tipo
    ? t.tipo === 'filme' && t.status === sub
    : sub === 'miniserie' ? t.tipo === 'miniserie' : t.tipo === 'serie' && t.status === sub);
}
function viewTitulos(host) {
  const emAndamento = st.tab === 'series' && st.sub === 'assistindo';
  if (emAndamento) {
    const n = titulosAtuais().filter(t => t.tem_nova_temporada).length;
    host.insertAdjacentHTML('beforeend', `<div class="panel" style="display:flex;align-items:center;gap:10px"><span class="dot"></span>
      <span style="flex:1"><b>${n}</b> ${n === 1 ? 'série com temporada nova' : 'séries com temporada nova'} para assistir</span>
      <button class="flag ${st.soNovas ? 'on' : ''}" id="so-novas">${st.soNovas ? 'Mostrar todas' : 'Só as novas'}</button></div>`);
    $('#so-novas').onclick = () => { st.soNovas = !st.soNovas; render(); };
  }
  searchBar(host, 'Adicionar', () => editTitulo());
  drawList = () => {
    const q = st.q.toLowerCase();
    let items = titulosAtuais().filter(t => t.titulo.toLowerCase().includes(q));
    if (emAndamento) {
      if (st.soNovas) items = items.filter(t => t.tem_nova_temporada);
      items = [...items].sort((a, b) => Number(b.tem_nova_temporada) - Number(a.tem_nova_temporada)); // novas primeiro
    }
    $('#list').innerHTML = items.length ? items.map(t => {
      const sub = [t.temporadas_assistidas != null && `${t.temporadas_assistidas} temp.`, t.proxima_temporada && `próx.: ${t.proxima_temporada}`, t.streaming, t.ano].filter(Boolean).join(' · ');
      const nova = emAndamento && t.tem_nova_temporada;
      const acoes = emAndamento ? `<button class="flag ${nova ? 'on' : ''}" data-flag="${t.id}" title="Marcar/desmarcar temporada nova disponível">${nova ? 'Nova temp.' : 'Marcar nova'}</button>${nova ? `<button class="primary" data-vi="${t.id}" title="Soma 1 às temporadas assistidas e remove a marca">Assisti</button>` : ''}` : '';
      return `<div class="row ${nova ? 'novo' : ''}"><span class="n">${t.ranking ?? ''}</span><div class="t">${esc(t.titulo)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
        ${t.nota != null ? `<span class="pill">★ ${t.nota}</span>` : ''}${acoes}
        <span class="actions"><button class="link" data-e="${t.id}">editar</button></span></div>`;
    }).join('') : '<p class="muted">Nada por aqui.</p>';
    const T = id => st.titulos.find(t => t.id === id);
    $('#list').querySelectorAll('[data-e]').forEach(b => (b.onclick = () => editTitulo(T(b.dataset.e))));
    $('#list').querySelectorAll('[data-flag]').forEach(b => (b.onclick = () => run('save_titulo', { id: b.dataset.flag, row: { tem_nova_temporada: !T(b.dataset.flag).tem_nova_temporada } })));
    $('#list').querySelectorAll('[data-vi]').forEach(b => (b.onclick = () => run('save_titulo', { id: b.dataset.vi, row: { temporadas_assistidas: (T(b.dataset.vi).temporadas_assistidas ?? 0) + 1, tem_nova_temporada: false } })));
  };
  drawList();
}
function editTitulo(t) {
  const isNew = !t;
  const base = t || (st.tab === 'filmes'
    ? { tipo: 'filme', status: st.sub }
    : st.sub === 'miniserie' ? { tipo: 'miniserie', status: 'encerrada' } : { tipo: 'serie', status: st.sub });
  const statuses = base.tipo === 'filme' ? ['assistido', 'para_assistir'] : base.tipo === 'miniserie' ? ['encerrada', 'assistindo', 'para_assistir'] : ['assistindo', 'para_assistir', 'encerrada'];
  const serie = base.tipo !== 'filme';
  dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${isNew ? 'Novo' : 'Editar'} ${base.tipo === 'filme' ? 'filme' : base.tipo === 'miniserie' ? 'minissérie' : 'série'}</h3>
    <label>Título</label><input id="f-titulo" value="${esc(base.titulo)}" required>
    <div class="grid2"><div><label>Situação</label><select id="f-status">${statuses.map(s => `<option value="${s}" ${s === base.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <div><label>Ranking (posição)</label><input id="f-ranking" type="number" value="${base.ranking ?? ''}"></div></div>
    <div class="grid2"><div><label>Streaming</label><input id="f-streaming" value="${esc(base.streaming)}"></div>
    <div><label>Nota (0–10)</label><input id="f-nota" type="number" step="0.1" min="0" max="10" value="${base.nota ?? ''}"></div></div>
    ${serie ? `<div class="grid2"><div><label>Temporadas assistidas</label><input id="f-temps" type="number" value="${base.temporadas_assistidas ?? ''}"></div>
    <div><label>Próxima temporada</label><input id="f-prox" placeholder="2027, 2026-09 ou 2026-11-11" value="${esc(base.proxima_temporada)}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="f-nova" type="checkbox" style="width:auto" ${base.tem_nova_temporada ? 'checked' : ''}> <span class="dot"></span> Temporada nova disponível para assistir</label>` :`<label>Ano</label><input id="f-ano" type="number" value="${base.ano ?? ''}">`}
    <label>Observação</label><textarea id="f-obs" rows="2">${esc(base.observacao)}</textarea>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button>
    <span style="flex:1"></span>${isNew ? '' : '<button value="del" formnovalidate style="color:var(--warn)">Excluir</button>'}</div></form>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v === 'del' && confirm('Excluir?')) return run('delete_titulo', { id: t.id });
    if (v !== 'ok') return;
    const num = id => { const x = $(id); return x && x.value !== '' ? Number(x.value) : null; };
    const row = { tipo: base.tipo, titulo: $('#f-titulo').value.trim(), status: $('#f-status').value, ranking: num('#f-ranking'),
      streaming: $('#f-streaming').value.trim() || null, nota: num('#f-nota'), observacao: $('#f-obs').value.trim() || null,
      temporadas_assistidas: serie ? num('#f-temps') : null, proxima_temporada: serie ? ($('#f-prox').value.trim() || null) : null, ano: serie ? null : num('#f-ano'),
      tem_nova_temporada: serie ? $('#f-nova').checked : false };
    run('save_titulo', { id: t?.id, row });
  };
  dlg.showModal();
}

// Livros
const faixa = i => (i === 0 ? [2, 100] : [i * 100 + 1, (i + 1) * 100]);
function viewLivros(host) {
  const fila = st.livros.filter(l => l.status === 'para_ler').sort((a, b) => a.posicao_fila - b.posicao_fila);
  if (st.sub === 'ranking') return viewRanking(host);
  const est = st.estado || { proximo_tipo: 'fora', faixa_idx: 0 };
  const [lo, hi] = faixa(est.faixa_idx), max = fila.length;
  const elegivel = l => est.proximo_tipo === 'ordem' ? l.posicao_fila === 1 : l.posicao_fila >= lo && (l.posicao_fila <= hi || max < lo);
  if (st.sub === 'fila') host.insertAdjacentHTML('beforeend', `<div class="panel">${est.proximo_tipo === 'ordem'
    ? `Vez do <b>primeiro da fila</b>: ${esc(fila[0]?.titulo ?? '—')}`
    : `Vez de um livro <b>fora de ordem</b>, entre as posições <b>${lo}</b> e <b>${Math.min(hi, max)}</b>. Os demais sobem de número ao escolher.`}</div>`);
  if (st.sub === 'lido') {
    const anos = [...new Set(st.livros.filter(l => l.status === 'lido').map(l => l.ano_leitura ?? 'antigos'))].sort().reverse();
    host.insertAdjacentHTML('beforeend', `<div class="bar"><select id="ano"><option value="todos">Todos os anos</option>${anos.map(a => `<option ${String(a) === st.lano ? 'selected' : ''}>${a}</option>`).join('')}</select></div>`);
    $('#ano').onchange = e => { st.lano = e.target.value; drawList(); };
  }
  searchBar(host, 'Adicionar', () => editLivro());
  drawList = () => {
    const q = st.q.toLowerCase();
    let items = st.sub === 'fila' ? fila : st.livros.filter(l => l.status === st.sub);
    if (st.sub === 'lido') items = items.filter(l => st.lano === 'todos' || String(l.ano_leitura ?? 'antigos') === st.lano).sort((a, b) => (b.ano_leitura ?? 0) - (a.ano_leitura ?? 0));
    items = items.filter(l => (l.titulo + ' ' + (l.autor ?? '')).toLowerCase().includes(q));
    const shown = items.slice(0, 300);
    $('#list').innerHTML = (shown.length ? shown.map(l => {
      const sub = [l.autor, l.categoria, l.comprado && 'comprado'].filter(Boolean).join(' · ');
      const act = l.status === 'para_ler' ? `<button data-go="${l.id}" ${elegivel(l) ? '' : 'disabled'} class="${elegivel(l) ? 'primary' : ''}">Começar</button>`
        : l.status === 'lendo' ? `<button data-fin="${l.id}" class="primary">Concluir</button>` : '';
      return `<div class="row"><span class="n">${l.posicao_fila ?? ''}</span><div class="t">${esc(l.titulo)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
        ${l.ano_leitura ? `<span class="pill">${l.ano_leitura}</span>` : ''}${act}<span class="actions"><button class="link" data-e="${l.id}">editar</button></span></div>`;
    }).join('') : '<p class="muted">Nada por aqui.</p>') + (items.length > shown.length ? `<p class="muted">Mostrando ${shown.length} de ${items.length}. Use a busca.</p>` : '');
    const L = id => st.livros.find(l => l.id === id);
    $('#list').querySelectorAll('[data-e]').forEach(b => (b.onclick = () => editLivro(L(b.dataset.e))));
    $('#list').querySelectorAll('[data-go]').forEach(b => (b.onclick = () => run('iniciar_leitura', { id: b.dataset.go })));
    $('#list').querySelectorAll('[data-fin]').forEach(b => (b.onclick = () => {
      const ano = prompt('Ano de leitura:', new Date().getFullYear()); if (!ano) return;
      run('concluir_leitura', { id: b.dataset.fin, ano });
    }));
  };
  drawList();
}
function editLivro(l) {
  const isNew = !l, base = l || { status: st.sub === 'fila' ? 'para_ler' : st.sub };
  dlg.innerHTML = `<form method="dialog"><h3 style="margin-top:0">${isNew ? 'Novo' : 'Editar'} livro</h3>
    <label>Título</label><input id="f-titulo" value="${esc(base.titulo)}" required>
    <div class="grid2"><div><label>Autor</label><input id="f-autor" value="${esc(base.autor)}"></div><div><label>Categoria</label><input id="f-cat" value="${esc(base.categoria)}"></div></div>
    <div class="grid2"><div><label>Situação</label><select id="f-status">${['para_ler', 'lendo', 'lido'].map(s => `<option value="${s}" ${s === base.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <div><label>Ano de leitura</label><input id="f-ano" type="number" value="${base.ano_leitura ?? ''}"></div></div>
    <div class="grid2"><div><label>Nota (0–10)</label><input id="f-nota" type="number" step="0.1" min="0" max="10" value="${base.nota ?? ''}"></div>
    <div><label>Comprado</label><select id="f-comp"><option value="0">Não</option><option value="1" ${base.comprado ? 'selected' : ''}>Sim</option></select></div></div>
    <label>Observação</label><textarea id="f-obs" rows="2">${esc(base.observacao)}</textarea>
    <p class="muted" style="font-size:12px">Novos livros entram no fim da fila. Para mudar a posição use o SQL ou a regra de escolha.</p>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" value="ok">Salvar</button><button value="x" formnovalidate>Cancelar</button>
    <span style="flex:1"></span>${isNew ? '' : '<button value="del" formnovalidate style="color:var(--warn)">Excluir</button>'}</div></form>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v === 'del' && confirm('Excluir?')) return run('delete_livro', { id: l.id });
    if (v !== 'ok') return;
    const num = id => ($(id).value !== '' ? Number($(id).value) : null);
    const status = $('#f-status').value;
    const row = { titulo: $('#f-titulo').value.trim(), autor: $('#f-autor').value.trim() || null, categoria: $('#f-cat').value.trim() || null,
      status, ano_leitura: num('#f-ano'), nota: num('#f-nota'), comprado: $('#f-comp').value === '1', observacao: $('#f-obs').value.trim() || null };
    run('save_livro', { id: l?.id, row });
  };
  dlg.showModal();
}
function viewRanking(host) {
  const nome = id => st.livros.find(l => l.id === id)?.titulo ?? '?';
  const bloco = (titulo, itens) => `<h3>${titulo}</h3>` + (itens.length ? itens.map(r => `<div class="row"><span class="n">${r.posicao}</span><div class="t">${esc(nome(r.livro_id))}</div></div>`).join('') : '<p class="muted">Ainda não preenchido.</p>');
  const anos = [...new Set(st.rank.filter(r => r.tipo === 'top10_ano').map(r => r.ano))].sort().reverse();
  host.insertAdjacentHTML('beforeend', bloco('Top 10 livros da vida', st.rank.filter(r => r.tipo === 'top10_vida').sort((a, b) => a.posicao - b.posicao))
    + anos.map(a => bloco(`Top 10 de ${a}`, st.rank.filter(r => r.tipo === 'top10_ano' && r.ano === a).sort((x, y) => x.posicao - y.posicao))).join('')
    + bloco('Melhor leitura de cada ano', st.rank.filter(r => r.tipo === 'melhor_ano').sort((a, b) => a.ano - b.ano).map(r => ({ posicao: r.ano, livro_id: r.livro_id }))));
}

boot();
